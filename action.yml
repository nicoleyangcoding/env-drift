name: env-drift
description: Flag environment variables your code reads that .env.example doesn't list, and listed ones nothing reads.
author: Nicole Yang
branding:
  icon: sliders
  color: green

inputs:
  path:
    description: Project folder to check.
    default: "."
  example:
    description: Example file to compare against. Found automatically when empty.
    default: ""
  ignore:
    description: Space-separated names or globs to skip, for example "DEBUG_* LOCAL_ONLY".
    default: ""
  strict:
    description: Also fail when the example file has entries nothing reads.
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Install env-drift
      shell: bash
      run: python -m pip install --quiet "$ACTION_PATH"
      env:
        ACTION_PATH: ${{ github.action_path }}
    - name: Check
      shell: bash
      env:
        CHECK_PATH: ${{ inputs.path }}
        EXAMPLE: ${{ inputs.example }}
        IGNORE: ${{ inputs.ignore }}
        STRICT: ${{ inputs.strict }}
      run: |
        args=("$CHECK_PATH" --format github)
        [ -n "$EXAMPLE" ] && args+=(--example "$EXAMPLE")
        for pattern in $IGNORE; do args+=(--ignore "$pattern"); done
        [ "$STRICT" = "true" ] && args+=(--strict)
        set +e
        output=$(env-drift "${args[@]}")
        status=$?
        set -e
        echo "$output"
        { echo "## env-drift"; echo; echo '```'; echo "$output" | grep -v '^::'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        exit $status
