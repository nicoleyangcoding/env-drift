[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "env-drift"
version = "0.1.0"
description = "Find environment variables your code reads that .env.example doesn't list, and listed ones nothing reads."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nicole Yang" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["dotenv", "env", "environment variables", ".env.example", "configuration", "cli", "github action"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/nicoleyangcoding/env-drift"
Issues = "https://github.com/nicoleyangcoding/env-drift/issues"
Changelog = "https://github.com/nicoleyangcoding/env-drift/blob/main/CHANGELOG.md"

[project.scripts]
env-drift = "env_drift.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/env_drift"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
